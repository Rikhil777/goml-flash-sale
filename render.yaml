services:
  - type: web
    name: goml-flash-sale-web
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeployTrigger: off
    domains:
      - flashsale.rikhilkakani.online
    envVars:
      - fromGroup: flashsale-app-secrets
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: flashsale.rikhilkakani.online,.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://flashsale.rikhilkakani.online,https://*.onrender.com
      - key: POSTGRES_CONN_MAX_AGE
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: goml-flash-sale-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: goml-flash-sale-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: goml-flash-sale-redis
          property: connectionString
      - key: GUNICORN_WORKERS
        value: "1"
      - key: CELERY_WORKER_CONCURRENCY
        value: "1"
      - key: CHECKOUT_RATE_LIMIT_REQUESTS
        value: "100"
      - key: CHECKOUT_RATE_LIMIT_WINDOW
        value: "60"
      - key: CHECKOUT_RATE_LIMIT_CLIENT_IP_HEADER
        value: ""

  - type: keyvalue
    name: goml-flash-sale-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: goml-flash-sale-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: flashsale
    user: flashsale

envVarGroups:
  - name: flashsale-app-secrets
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
